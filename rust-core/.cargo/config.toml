# -----------------------------------------------------------------------------
# CRT matching: the Rust staticlib MUST be built with the static CRT so that it
# matches the C++ DLL's /MT (Release) and /MTd (Debug) settings in
# http-1c-dll/CMakeLists.txt (lines ~62-68).
#
# Mixing dynamic CRT (Rust default on *-msvc) with the C++ side's static CRT
# leads to multiple-CRT linker conflicts and undefined behaviour around heap
# ownership. `+crt-static` forces the static CRT for the MSVC target so both
# sides agree.
#
# Note: this scopes the rustflag to the MSVC target only, so a non-Windows
# `cargo test`/`cargo check` (e.g. on a CI Linux box) is unaffected.
# -----------------------------------------------------------------------------
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
