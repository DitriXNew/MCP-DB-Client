name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Git for Windows ships a GNU coreutils `link.exe` in usr/bin; under
      # `shell: bash` it shadows the MSVC linker on PATH, so cargo/rustc link
      # steps fail with a GNU `link` invoked on MSVC args. Remove it so cargo
      # finds MSVC's link.exe.
      - name: Remove GNU link.exe (shadows MSVC linker under bash)
        shell: pwsh
        run: |
          $p = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $p) { Remove-Item $p -Force }

      # The full (RAG) build produces the rcore.dll cdylib via `cargo build`
      # (the lite C++ build needs no cargo), and the Rust-core tests below need
      # cargo. Pin the toolchain for a deterministic, msvc-targeted build.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Test Rust core
        shell: bash
        run: cargo test --manifest-path rust-core/Cargo.toml

      - name: Build DLL (Release, lite)
        shell: bash
        run: |
          cd http-1c-dll
          rm -rf build
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      # Full ("RAG") build check: compile the rcore.dll cdylib with the
      # fastembed feature and the dynamic CRT (ort/onnxruntime needs /MD). This
      # catches fastembed/ort build breakage without re-running CMake. The model
      # is fetched at runtime, so nothing is downloaded here. Rust is cached
      # above (Swatinem/rust-cache), so this stays cheap after the first run.
      - name: Build rcore.dll (fastembed, dynamic CRT)
        shell: bash
        env:
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: |
          cargo build --release --features fastembed \
            --target x86_64-pc-windows-msvc \
            --manifest-path rust-core/Cargo.toml

      - name: Build tests
        shell: bash
        run: |
          cd tests
          rm -rf build
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Run tests
        shell: bash
        run: |
          cd tests/build
          ./http1c_tests.exe
