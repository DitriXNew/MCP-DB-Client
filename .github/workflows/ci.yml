name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The DLL build invokes `cargo build` (via CMake) to produce rust-core's
      # staticlib, so the Rust toolchain must be present. windows-latest ships
      # Rust preinstalled, but pin it explicitly for a deterministic build and
      # to guarantee the x86_64-pc-windows-msvc target.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Test Rust core
        shell: bash
        run: cargo test --manifest-path rust-core/Cargo.toml

      - name: Build DLL (Release)
        shell: bash
        run: |
          cd http-1c-dll
          rm -rf build
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Build tests
        shell: bash
        run: |
          cd tests
          rm -rf build
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Run tests
        shell: bash
        run: |
          cd tests/build
          ./http1c_tests.exe
