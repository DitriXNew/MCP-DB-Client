name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.3.0). Leave empty to read from version.h'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The full ("RAG") build invokes `cargo build` (via CMake) to produce the
      # rcore.dll cdylib (fastembed search core), so the Rust toolchain must be
      # present. The lite build is pure C++ and needs no cargo.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      # ---- LITE variant: libhttp1cWin.dll alone (no cargo, search returns
      # "install RAG"). The committed Template.bin tracks this bundle. ----
      - name: Build DLL (Release, lite)
        shell: bash
        run: |
          cd http-1c-dll
          rm -rf build
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Build and run tests
        shell: bash
        run: |
          cd tests
          rm -rf build
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build .
          ./http1c_tests.exe

      - name: Package add-in (lite)
        shell: bash
        run: VARIANT=lite bash build/package-http1c-addin.sh

      # ---- FULL variant: also build rcore.dll (real fastembed search core).
      # -DRCORE_FASTEMBED=ON makes CMake invoke cargo with the dynamic-CRT
      # RUSTFLAGS and drop rcore.dll next to the component. The model is fetched
      # at RUNTIME, so nothing extra is downloaded at build time. Packaging adds
      # rcore.dll + DirectML.dll (from System32) to the bundle; SKIP_TEMPLATE=1
      # keeps the committed lite Template.bin from being clobbered. ----
      - name: Build DLL + rcore.dll (Release, full)
        shell: bash
        run: |
          cd http-1c-dll
          rm -rf build
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DRCORE_FASTEMBED=ON
          cmake --build .

      - name: Package add-in (full)
        shell: bash
        run: VARIANT=full SKIP_TEMPLATE=1 bash build/package-http1c-addin.sh

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # Strip leading 'v' and optional dot: v1.3.0 → 1.3.0, v.1.3.0 → 1.3.0
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION="${VERSION#.}"
          else
            VERSION=$(grep '^#define VERSION_SEMVER' http-1c-dll/version.h | sed 's/.*"\(.*\)"/\1/')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename artifacts with version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          cp "build/artifacts/http1c-addin.zip"      "build/artifacts/http1c-addin-lite-v${VERSION}.zip"
          cp "build/artifacts/http1c-addin-full.zip" "build/artifacts/http1c-addin-full-v${VERSION}.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.VERSION }}"
          name: "http1c v${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          files: |
            build/artifacts/http1c-addin-lite-v${{ steps.version.outputs.VERSION }}.zip
            build/artifacts/http1c-addin-full-v${{ steps.version.outputs.VERSION }}.zip
